<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>縦書きドキュメント v007</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">縦</div>
    <div class="doc-head">
      <div class="title-row">
        <input id="docTitle" class="doc-title" value="無題のドキュメント" aria-label="文書タイトル" />
        <span id="saveState" class="save-state">保存済み</span>
      </div>
      <nav class="menu-row" aria-label="メインメニュー">
        <button class="menu-btn" data-menu="file">ファイル</button>
        <button class="menu-btn" data-menu="edit">編集</button>
        <button class="menu-btn" data-menu="view">表示</button>
        <button class="menu-btn" data-menu="insert">挿入</button>
        <button class="menu-btn" data-menu="format">書式</button>
        <button class="menu-btn" data-menu="tools">ツール</button>
      </nav>
    </div>
    <div class="top-actions">
      <button id="newDoc" class="ghost-btn">新規</button>
      <button id="exportBtn" class="primary-btn">書き出し</button>
    </div>
  </header>

  <div id="menuPanel" class="menu-panel" hidden></div>

  <section class="toolbar" aria-label="書式ツールバー">
    <div class="tool-group">
      <button id="undoBtn" class="icon-btn" title="元に戻す Ctrl+Z">↶</button>
      <button id="redoBtn" class="icon-btn" title="やり直す Ctrl+Y">↷</button>
      <button id="printBtn" class="icon-btn" title="印刷">🖨</button>
    </div>
    <div class="divider"></div>
    <select id="zoomSelect" class="select compact" aria-label="ズーム">
      <option value="0.75">75%</option>
      <option value="1" selected>100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
    </select>
    <div class="divider"></div>
    <select id="paperSizeSelect" class="select paper-size-select" aria-label="用紙サイズ" title="用紙サイズ">
      <option value="A4" selected>A4（210mm×297mm）</option>
      <option value="A5">A5（148mm×210mm）</option>
      <option value="B5">B5（182mm×257mm）</option>
      <option value="B6">B6（128mm×182mm）</option>
      <option value="LETTER">Letter（215.9mm×279.4mm）</option>
    </select>
    <select id="paperOrientationSelect" class="select paper-orientation-select" aria-label="用紙の向き" title="用紙の向き">
      <option value="portrait" selected>縦長</option>
      <option value="landscape">横長</option>
    </select>
    <button id="marginBtn" class="format-btn wide" title="文字を書く範囲（余白）を設定">余白</button>
    <div class="divider"></div>
    <select id="blockSelect" class="select" aria-label="段落スタイル">
      <option value="p">標準テキスト</option>
      <option value="h1">見出し 1</option>
      <option value="h2">見出し 2</option>
      <option value="blockquote">引用</option>
    </select>
    <select id="fontSelect" class="select font-select" aria-label="フォント">
      <option value="Noto Serif JP">Noto Serif JP</option>
      <option value="Yu Mincho">游明朝</option>
      <option value="Hiragino Mincho ProN">ヒラギノ明朝</option>
      <option value="Yu Gothic">游ゴシック</option>
      <option value="sans-serif">ゴシック</option>
    </select>
    <div class="font-size-control" title="文字サイズ">
      <input id="fontSizeInput" class="font-size-input" type="number" min="6" max="200" step="1" value="12" aria-label="文字サイズ" />
      <span class="font-size-unit">pt</span>
    </div>
    <div class="divider"></div>
    <button id="boldBtn" class="format-btn" title="太字 Ctrl+B"><b>B</b></button>
    <button id="italicBtn" class="format-btn" title="斜体 Ctrl+I"><i>I</i></button>
    <button id="underlineBtn" class="format-btn" title="下線 Ctrl+U"><u>U</u></button>
    <div class="divider"></div>
    <button id="findBtn" class="format-btn wide" title="検索 Ctrl+F">検索</button>
    <button id="directionBtn" class="direction-btn" aria-pressed="true">縦書き</button>
    <button id="latinOrientationBtn" class="direction-btn latin-btn" aria-pressed="false" title="縦書き時の英字の向き">英字：横</button>
  </section>

  <section class="tabs-bar" aria-label="文書タブ">
    <div id="tabsList" class="tabs-list"></div>
    <button id="addTabBtn" class="add-tab-btn" type="button" title="タブを追加" aria-label="タブを追加">＋</button>
  </section>

  <main class="workspace">
    <div class="ruler" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div id="paperStage" class="paper-stage">
      <div id="pagesContainer" class="pages-container">
        <article id="paper" class="paper vertical" aria-label="文書編集領域">
          <div id="editor" class="editor" contenteditable="true" spellcheck="false" data-placeholder="ここに文章を入力"></div>
        </article>
      </div>
    </div>
  </main>

  <footer class="statusbar">
    <span id="charCount">0 文字</span>
    <span id="directionState">縦書き / 右→左</span>
    <span id="paperState">A4 / 縦長</span>
    <span>v007</span>
  </footer>

  <dialog id="findDialog" class="dialog">
    <form method="dialog" class="dialog-card" onsubmit="return false;">
      <div class="dialog-title">検索と置換</div>
      <label>検索<input id="findInput" type="text" /></label>
      <label>置換<input id="replaceInput" type="text" /></label>
      <div class="dialog-actions">
        <button id="findNextBtn" type="button" class="ghost-btn">次を検索</button>
        <button id="replaceOneBtn" type="button" class="ghost-btn">置換</button>
        <button id="replaceAllBtn" type="button" class="primary-btn">すべて置換</button>
        <button id="closeFindBtn" type="button" class="ghost-btn">閉じる</button>
      </div>
      <div id="findMessage" class="dialog-note"></div>
    </form>
  </dialog>

  <dialog id="exportDialog" class="dialog">
    <form method="dialog" class="dialog-card" onsubmit="return false;">
      <div class="dialog-title">書き出し</div>
      <p class="dialog-note">PDF / HTML / IDML の3形式で書き出せます。PDFはブラウザの印刷画面から「PDFに保存」を選択してください。</p>
      <div class="export-grid">
        <button id="exportPdfBtn" type="button" class="export-option">PDF<br><small>印刷画面から保存</small></button>
        <button id="exportHtmlBtn" type="button" class="export-option">HTML<br><small>縦書き書式付き</small></button>
        <button id="exportIdmlBtn" type="button" class="export-option">IDML<br><small>InDesign用</small></button>
      </div>
      <div class="dialog-actions end">
        <button id="closeExportBtn" type="button" class="ghost-btn">閉じる</button>
      </div>
    </form>
  </dialog>

  <dialog id="marginDialog" class="dialog">
    <form method="dialog" class="dialog-card margin-dialog-card" onsubmit="return false;">
      <div class="dialog-title">余白設定</div>
      <p class="dialog-note">文字を書く範囲を、用紙端からの余白（mm）で指定します。</p>
      <div class="margin-grid">
        <label>上<input id="marginTopInput" type="number" min="0" max="100" step="1" value="18" /> mm</label>
        <label>下<input id="marginBottomInput" type="number" min="0" max="100" step="1" value="18" /> mm</label>
        <label>左<input id="marginLeftInput" type="number" min="0" max="100" step="1" value="18" /> mm</label>
        <label>右<input id="marginRightInput" type="number" min="0" max="100" step="1" value="18" /> mm</label>
      </div>
      <div class="dialog-actions end">
        <button id="closeMarginBtn" type="button" class="ghost-btn">キャンセル</button>
        <button id="applyMarginBtn" type="button" class="primary-btn">適用</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
